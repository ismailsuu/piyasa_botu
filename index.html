<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gemi Trafiği</title>
    
    <!-- PWA Kurulum ve Mobil Uyum Etiketleri -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/870/870143.png">
    
    <!-- Veri Okuma ve Grafik Kütüphaneleri -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --text: #f8fafc;
            --accent: #3b82f6;
            --border: #334155;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: var(--bg); color: var(--text); padding: 20px; }
        
        .header { margin-bottom: 20px; text-align: center; }
        
        /* Pill Menu (Mobilde Yatay Kaydırılabilir) */
        .nav-pills {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            white-space: nowrap;
            padding-bottom: 10px;
            margin-bottom: 20px;
            scrollbar-width: none;
        }
        .nav-pills::-webkit-scrollbar { display: none; }
        .pill {
            background-color: var(--card);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 10px 20px;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .pill.active { background-color: var(--accent); border-color: var(--accent); }
        
        /* Metrik Kartları */
        .metrics {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        .card {
            background-color: var(--card);
            padding: 15px;
            border-radius: 12px;
            border: 1px solid var(--border);
            text-align: center;
        }
        .card h4 { color: #94a3b8; font-size: 0.9rem; margin-bottom: 8px; font-weight: normal; }
        .card h2 { font-size: 1.8rem; margin: 0; }
        .date-info { color: #94a3b8; font-size: 0.8rem; text-align: center; margin-bottom: 20px; }
        
        /* Grafik Kapsayıcı (Mobil Dinamik Yükseklik) */
        .chart-container {
            background-color: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 15px;
            height: 400px;
            position: relative;
            width: 100%;
        }
        @media (max-width: 768px) {
            body { padding: 15px; }
            .chart-container { height: 300px; }
        }
        #loader { text-align: center; color: var(--accent); margin: 20px 0; font-weight: bold; }
    </style>
</head>
<body>

    <div class="header">
        <h2>🚢 Kritik Boğazlar Trafiği</h2>
    </div>

    <!-- Menü -->
    <div class="nav-pills" id="menu">
        <div class="pill active" onclick="changeStrait('Süveyş Kanalı')">Süveyş Kanalı</div>
        <div class="pill" onclick="changeStrait('Babülmendep')">Babülmendep</div>
        <div class="pill" onclick="changeStrait('Hürmüz')">Hürmüz</div>
        <div class="pill" onclick="changeStrait('Ümit Burnu')">Ümit Burnu</div>
    </div>

    <div id="loader">Canlı Veriler Çekiliyor...</div>
    <div class="date-info" id="m-date"></div>

    <!-- Özet Kartları -->
    <div class="metrics">
        <div class="card"><h4>Toplam</h4><h2 id="m-total">-</h2></div>
        <div class="card"><h4>Tanker</h4><h2 id="m-tanker">-</h2></div>
        <div class="card"><h4>Konteyner</h4><h2 id="m-container">-</h2></div>
        <div class="card"><h4>Kuru Yük</h4><h2 id="m-bulk">-</h2></div>
    </div>

    <!-- Trend Grafiği -->
    <div class="chart-container">
        <canvas id="myChart"></canvas>
    </div>

    <script>
        // PWA Servis Çalışanını Başlat
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js').catch(err => console.log(err));
        }

        let globalData = [];
        let myChart = null;

        const chokepoints = {
            'Süveyş Kanalı': 'chokepoint1',
            'Babülmendep': 'chokepoint2',
            'Hürmüz': 'chokepoint6',
            'Ümit Burnu': 'chokepoint8'
        };

        // CORS güvenlik engellerini aşmak için proxy rotaları (Sırayla dener)
        async function loadData() {
            const targetUrl = encodeURIComponent("https://hub.arcgis.com/api/v3/datasets/3da2b9ca97684916b75c4013f95d18ab_0/downloads/data?format=csv");
            
            const proxies = [
                `https://api.allorigins.win/raw?url=${targetUrl}`,
                `https://corsproxy.io/?${targetUrl}`
            ];

            for (let url of proxies) {
                try {
                    let response = await fetch(url);
                    if (response.ok) {
                        let csvText = await response.text();
                        
                        // Hata sayfası döndüyse atla
                        if (csvText.trim().startsWith("<") || !csvText.toLowerCase().includes("date")) {
                            continue;
                        }

                        Papa.parse(csvText, {
                            header: true,
                            dynamicTyping: true,
                            complete: function(results) {
                                globalData = results.data;
                                document.getElementById('loader').style.display = 'none';
                                changeStrait('Süveyş Kanalı'); 
                            }
                        });
                        return; // Başarılı olunca döngüden çık
                    }
                } catch (err) {
                    console.log("Proxy başarısız: " + url);
                }
            }
            
            document.getElementById('loader').innerText = "Veri çekilemedi. Tarayıcı veya internet güvenlik ayarlarınızı kontrol edin.";
        }

        function changeStrait(straitName) {
            document.querySelectorAll('.pill').forEach(el => {
                el.classList.remove('active');
                if(el.innerText === straitName) el.classList.add('active');
            });

            const pid = chokepoints[straitName];
            
            let filtered = globalData.filter(r => {
                let rId = (r.portid || r.chokepoint || r.name || "").toString().toLowerCase();
                return rId.includes(pid);
            });

            filtered = filtered.map(r => {
                let d = new Date(r.date);
                return {
                    dateObj: d,
                    dateStr: d.toISOString().split('T')[0],
                    total: Number(r.n_total || r.transit_calls || r.total_calls || 0),
                    tanker: Number(r.n_tanker || r.tanker_calls || r.tankers || 0),
                    container: Number(r.n_container || r.container_calls || r.containers || 0),
                    bulk: Number(r.n_dry_bulk || r.dry_bulk_calls || r.cargo_calls || 0)
                };
            }).filter(r => !isNaN(r.dateObj.getTime()) && r.total > 0);

            filtered.sort((a,b) => b.dateObj - a.dateObj);
            if(filtered.length === 0) return;

            const latest = filtered[0];
            document.getElementById('m-total').innerText = latest.total;
            document.getElementById('m-tanker').innerText = latest.tanker;
            document.getElementById('m-container').innerText = latest.container;
            document.getElementById('m-bulk').innerText = latest.bulk;
            document.getElementById('m-date').innerText = "Son Geçerli Veri: " + latest.dateStr;

            // Son 6 ayı (yaklaşık 180 gün) grafiğe aktar
            let chartData = filtered.slice(0, 180).reverse();
            drawChart(chartData, straitName);
        }

        function drawChart(data, name) {
            const ctx = document.getElementById('myChart').getContext('2d');
            if(myChart) myChart.destroy();
            
            myChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: data.map(d => d.dateStr),
                    datasets: [{
                        label: 'Toplam Gemi Geçişi',
                        data: data.map(d => d.total),
                        borderColor: '#3b82f6',
                        backgroundColor: 'rgba(59, 130, 246, 0.1)',
                        borderWidth: 2,
                        fill: true,
                        pointRadius: 1,
                        tension: 0.3
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        y: { grid: { color: '#334155' }, ticks: { color: '#94a3b8' } },
                        x: { grid: { display: false }, ticks: { color: '#94a3b8', maxTicksLimit: 6 } }
                    }
                }
            });
        }
        
        loadData();
    </script>
</body>
</html>
