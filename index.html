<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lojistik PWA</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/870/870143.png">
    
    <!-- TradingView Kütüphanesi -->
    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>

    <style>
        :root { --bg: #0f172a; --card: #1e293b; --text: #f8fafc; --accent: #3b82f6; --border: #334155; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
        body { background-color: var(--bg); color: var(--text); padding: 20px; }
        
        .header { margin-bottom: 15px; text-align: center; }
        .header h2 { font-size: 1.5rem; margin-bottom: 5px; }
        .header p { color: #94a3b8; font-size: 0.85rem; }
        
        /* Pill Menu */
        .nav-pills { display: flex; gap: 10px; overflow-x: auto; white-space: nowrap; padding-bottom: 10px; margin-bottom: 15px; scrollbar-width: none; }
        .nav-pills::-webkit-scrollbar { display: none; }
        .pill { background-color: var(--card); border: 1px solid var(--border); color: var(--text); padding: 10px 20px; border-radius: 50px; cursor: pointer; transition: all 0.2s; font-size: 0.9rem; }
        .pill.active { background-color: var(--accent); border-color: var(--accent); }
        
        /* Bildirim ve Hata Kutusu */
        #status-box {
            display: none;
            padding: 12px;
            margin-bottom: 15px;
            border-radius: 8px;
            text-align: center;
            font-size: 0.9rem;
            font-weight: bold;
        }
        
        /* Grafik Konteyneri */
        .chart-container { 
            background-color: var(--card); 
            border: 1px solid var(--border); 
            border-radius: 12px; 
            padding: 10px; 
            height: calc(100vh - 220px); 
            min-height: 400px;
            width: 100%; 
            overflow: hidden;
            position: relative;
        }
        
        #tv_chart { width: 100%; height: 100%; }

        @media (max-width: 768px) { 
            body { padding: 15px; } 
            .chart-container { height: calc(100vh - 190px); } 
        }
    </style>
</head>
<body>

    <div class="header">
        <h2>🚢 Küresel Denizcilik ve Navlun</h2>
        <p>Tedarik Zinciri ve Lojistik Fiyatlamaları</p>
    </div>

    <!-- Hızlı Seçim Menüsü -->
    <div class="nav-pills" id="menu">
        <div class="pill active" onclick="loadChart('AMEX:BDRY', this)">Kuru Yük (BDRY)</div>
        <div class="pill" onclick="loadChart('NYSE:ZIM', this)">ZIM Konteyner</div>
        <div class="pill" onclick="loadChart('XETR:HLAG', this)">Hapag-Lloyd</div>
        <div class="pill" onclick="loadChart('OTC:AMKBY', this)">Maersk</div>
        <div class="pill" onclick="loadChart('TVC:UKOIL', this)">Brent Petrol</div>
    </div>

    <!-- Durum/Hata Ekranı -->
    <div id="status-box"></div>

    <!-- TradingView Grafiği -->
    <div class="chart-container">
        <div id="tv_chart"></div>
    </div>

    <script>
        // PWA Servis Çalışanını Başlat
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js').catch(err => console.log("Servis çalışanı yüklenemedi:", err));
        }

        let widget = null;
        const statusBox = document.getElementById('status-box');

        function showMessage(msg, isError = false) {
            statusBox.style.display = 'block';
            statusBox.innerText = msg;
            if (isError) {
                statusBox.style.backgroundColor = 'rgba(239, 68, 68, 0.1)'; // Kırmızımsı arka plan
                statusBox.style.color = '#ef4444'; // Kırmızı yazı
                statusBox.style.border = '1px solid #ef4444';
            } else {
                statusBox.style.backgroundColor = 'rgba(59, 130, 246, 0.1)'; // Mavimsi arka plan
                statusBox.style.color = '#3b82f6'; // Mavi yazı
                statusBox.style.border = '1px solid #3b82f6';
            }
        }

        function hideMessage() {
            statusBox.style.display = 'none';
        }

        function loadChart(symbol, element) {
            // İnternet bağlantısı kontrolü
            if (!navigator.onLine) {
                showMessage("HATA: İnternet bağlantınız yok. Lütfen bağlantınızı kontrol edin.", true);
                return;
            }

            // Menü aktiflik durumunu güncelle
            document.querySelectorAll('.pill').forEach(el => el.classList.remove('active'));
            if(element) element.classList.add('active');

            const container = document.getElementById('tv_chart');
            container.innerHTML = '';
            
            showMessage("Grafik verileri yükleniyor...");

            // TradingView script'inin (AdBlock vb. yüzünden) engellenip engellenmediğini kontrol et
            if (typeof TradingView === 'undefined') {
                showMessage("HATA: TradingView altyapısına ulaşılamıyor. Lütfen Reklam Engelleyiciyi (AdBlock/Brave Shields) kapatıp sayfayı yenileyin.", true);
                return;
            }

            try {
                widget = new TradingView.widget({
                    "autosize": true,
                    "symbol": symbol,
                    "interval": "D",
                    "timezone": "Europe/Istanbul",
                    "theme": "dark",
                    "style": "2",
                    "locale": "tr",
                    "enable_publishing": false,
                    "backgroundColor": "#1e293b",
                    "gridColor": "#334155",
                    "hide_top_toolbar": false,
                    "hide_legend": false,
                    "save_image": false,
                    "container_id": "tv_chart"
                });

                // Widget çalıştıktan kısa bir süre sonra içinde iFrame oluştu mu diye kontrol et
                setTimeout(() => {
                    if (container.innerHTML.trim() === '') {
                        showMessage(`HATA: '${symbol}' verisi alınamadı. Sembol hatalı veya sistem geçici olarak meşgul.`, true);
                    } else {
                        hideMessage(); // Sorun yoksa mesaj kutusunu gizle
                    }
                }, 1500);

            } catch (err) {
                showMessage(`KRİTİK HATA: Grafik oluşturulurken sistem çöktü. Detay: ${err.message}`, true);
            }
        }

        // Sayfa açıldığında ilk grafiği yükle
        window.onload = () => {
            loadChart('AMEX:BDRY', document.querySelector('.pill.active'));
        };
    </script>
</body>
</html>
